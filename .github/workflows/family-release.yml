name: FlexAccess family release gate

# The release gate of the four FlexAccess plugins (tool_flexaccess #12).
#
# .github/flexaccess-family.lock.json pins auth, enrol and mod to exact commit SHAs, tool_flexaccess to
# the commit that contains the lock ("SELF") and tool_mergeusers to an exact commit. This workflow tests
# exactly that combination - the same lock for the PHPUnit matrix of all four plugins and for the
# two-site LTI 1.3 end-to-end journeys - and records the SHA matrix, the Moodle/PHP/database versions
# and the checksums of the distributed ZIPs (git archive) as the evidence artefact. A missing or short
# SHA, a commit whose version differs from the lock, an unpinned tool_mergeusers or a ZIP checksum that
# differs from a pinned one fail the gate; nothing falls back to a branch.
#
# Release procedure:
#   1. Upload auth, enrol and mod at the new family version.
#   2. Run this workflow with mode "propose" (or locally:
#      python3 .github/scripts/flexaccess_family.py pin --ref development); it prints the lock for the
#      current heads. Commit it as .github/flexaccess-family.lock.json together with tool_flexaccess.
#   3. The push of the lock runs the gate ("verify"). Tag and set $plugin->supported only after it is green.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = test the committed lock; propose = print a lock for the heads of "ref"'
        type: choice
        options: [verify, propose]
        default: verify
      ref:
        description: 'Branch whose heads "propose" pins'
        default: development
  push:
    paths:
      - '.github/flexaccess-family.lock.json'

concurrency:
  group: family-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: "Lock (exact commits)"
    runs-on: ubuntu-22.04
    outputs:
      lock: ${{ steps.verify.outputs.lock }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Self-test of the family resolver
        run: python3 plugin/.github/scripts/test_flexaccess_family.py
      - name: Propose a lock for the current heads
        if: ${{ github.event.inputs.mode == 'propose' }}
        run: |
          python3 plugin/.github/scripts/flexaccess_family.py pin --ref "${{ github.event.inputs.ref }}" > proposed-lock.json
          { echo '### Proposed .github/flexaccess-family.lock.json'; echo '```json'; cat proposed-lock.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat proposed-lock.json
          echo "Commit this file as .github/flexaccess-family.lock.json to run the gate."
          exit 1
      - name: Verify the committed lock
        id: verify
        run: |
          python3 plugin/.github/scripts/flexaccess_family.py lock --lock-file plugin/.github/flexaccess-family.lock.json \
            --self tool_flexaccess --self-dir plugin --self-sha "$GITHUB_SHA" --out family-lock.json \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Checksums of the distributed ZIPs
        run: |
          python3 plugin/.github/scripts/flexaccess_family.py zipcheck --lock-file family-lock.json --out zip-sha256.json
          { echo '### Release ZIPs (git archive, SHA-256)'; echo '```'; cat zip-sha256.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the lock and the checksums
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: flexaccess-family-evidence-lock
          path: |
            family-lock.json
            zip-sha256.json
          if-no-files-found: ignore

  phpunit:
    name: "PHPUnit (all four) / ${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.database }}"
    runs-on: ubuntu-22.04
    needs: [lock]
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: ${{ matrix.mariadb }}
        env:
          MARIADB_USER: 'root'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.2', database: pgsql, postgres: 'postgres:16', mariadb: 'mariadb:10.11' }
          - { moodle: MOODLE_500_STABLE, php: '8.2', database: mariadb, postgres: 'postgres:16', mariadb: 'mariadb:10.11' }
          - { moodle: MOODLE_502_STABLE, php: '8.3', database: pgsql, postgres: 'postgres:16', mariadb: 'mariadb:10.11' }
          - { moodle: MOODLE_503_STABLE, php: '8.3', database: pgsql, postgres: 'postgres:17', mariadb: 'mariadb:11.4' }
          - { moodle: MOODLE_503_STABLE, php: '8.4', database: mariadb, postgres: 'postgres:17', mariadb: 'mariadb:11.4' }
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle with exactly the locked family
        run: |
          python3 plugin/.github/scripts/flexaccess_family.py fetch --lock-json "$FAMILY_LOCK" \
            --self tool_flexaccess --dest moodle-plugin-ci-plugins --with-mergeusers
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
          set -o pipefail; php plugin/.github/scripts/record_environment.php moodle | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          FAMILY_LOCK: ${{ needs.lock.outputs.lock }}
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: PHPUnit of all four plugins
        run: |
          cd moodle
          rc=0
          for suite in auth_flexaccess enrol_flexaccess mod_flexaccess tool_flexaccess; do
            echo "::group::$suite"
            vendor/bin/phpunit --fail-on-warning --testsuite "${suite}_testsuite" || rc=1
            echo "::endgroup::"
          done
          exit $rc

  lti:
    name: "LTI 1.3 ${{ matrix.side }} / ${{ matrix.moodle }}"
    runs-on: ubuntu-latest
    needs: [lock]
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { side: provider, moodle: MOODLE_405_STABLE, php: '8.2', postgres: 'postgres:16' }
          - { side: consumer, moodle: MOODLE_405_STABLE, php: '8.2', postgres: 'postgres:16' }
          - { side: provider, moodle: MOODLE_503_STABLE, php: '8.3', postgres: 'postgres:17' }
          - { side: consumer, moodle: MOODLE_503_STABLE, php: '8.3', postgres: 'postgres:17' }
    env:
      WORK: ${{ github.workspace }}/lti
      CERTS: ${{ github.workspace }}/certs
      DBTYPE: pgsql
      DBHOST: 127.0.0.1
      DBPORT: 5432
      DBUSER: moodle
      DBPASS: moodle
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins/moodle-tool_flexaccess
      - name: Fetch exactly the locked family
        env:
          FAMILY_LOCK: ${{ needs.lock.outputs.lock }}
        run: |
          python3 plugins/moodle-tool_flexaccess/.github/scripts/flexaccess_family.py fetch --lock-json "$FAMILY_LOCK" \
            --self tool_flexaccess --dest plugins --with-mergeusers
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif, sodium
          ini-values: max_input_vars=5000
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out Moodle
        run: |
          git clone --depth 1 --branch "${{ matrix.moodle }}" https://github.com/moodle/moodle.git moodle
          cd moodle && composer install --no-dev --no-interaction --quiet
      - name: Hostnames and test CA
        run: |
          echo "127.0.0.1 platform.test provider.test" | sudo tee -a /etc/hosts
          mkdir -p "$CERTS" && cd "$CERTS"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=FlexAccess LTI test CA" -keyout ca.key -out ca.crt
          for site in platform provider; do
            openssl req -newkey rsa:2048 -nodes -subj "/CN=$site.test" -keyout "$site.key" -out "$site.csr"
            printf "subjectAltName=DNS:%s.test\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n" "$site" > "$site.ext"
            openssl x509 -req -in "$site.csr" -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 -extfile "$site.ext" -out "$site.crt"
          done
          sudo cp ca.crt /usr/local/share/ca-certificates/flexaccess-lti-test.crt
          sudo update-ca-certificates
      - name: Install Playwright and browsers
        run: |
          cd plugins/moodle-enrol_flexaccess/tests/playwright
          npm ci
          if [ "${{ matrix.side }}" = consumer ]; then
            npx playwright install --with-deps chromium firefox
          else
            npx playwright install --with-deps chromium
          fi
      # Sites and journeys in ONE step: the servers are background processes of this step.
      - name: Build both sites and run the @${{ matrix.side }} journeys
        run: |
          for db in lti_platform lti_provider; do
            PGPASSWORD=moodle psql -h 127.0.0.1 -U moodle -d moodle -qc \
              "CREATE DATABASE $db OWNER moodle ENCODING 'UTF8' TEMPLATE template0;"
          done
          MOODLE_SRC="$GITHUB_WORKSPACE/moodle" PLUGINS_DIR="$GITHUB_WORKSPACE/plugins" \
            MERGEUSERS_DIR="$GITHUB_WORKSPACE/plugins/moodle-tool_mergeusers" \
            bash plugins/moodle-enrol_flexaccess/tests/playwright/lti/setup-sites.sh
          set -a; . "$WORK/lti.env"; set +a
          if [ "${{ matrix.side }}" = consumer ]; then export LTI_BROWSERS=chromium,firefox; else export LTI_BROWSERS=chromium; fi
          cd plugins/moodle-enrol_flexaccess/tests/playwright
          npx playwright test -c lti/lti.config.js --grep "@${{ matrix.side }}"
      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: flexaccess-family-evidence-lti-${{ matrix.side }}-${{ matrix.moodle }}
          path: |
            plugins/moodle-enrol_flexaccess/tests/playwright/lti/playwright-report
            plugins/moodle-enrol_flexaccess/tests/playwright/lti/test-results
            lti/*.log
          retention-days: 30
          if-no-files-found: ignore

  gate:
    name: "Release gate"
    runs-on: ubuntu-22.04
    needs: [lock, phpunit, lti]
    if: ${{ always() }}
    steps:
      - name: Every job of the locked combination must have passed
        run: |
          result="${{ needs.lock.result }}-${{ needs.phpunit.result }}-${{ needs.lti.result }}"
          echo "lock-phpunit-lti: $result"
          [ "$result" = "success-success-success" ] || { echo "The release gate is not green."; exit 1; }
          echo "Release gate green for the locked combination (see the lock artefact for the SHAs)."
